name: Release

# 打 tag（如 1.0.0）时自动构建三平台并发布；
# 也可以在 Actions 页手动触发，用 dry-run 只出包不发版。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手动触发必填，例如 1.0.0）"
        type: string
        default: ""
      dry_run:
        description: "只构建、不创建 Release"
        type: boolean
        default: true

env:
  UNITY_VERSION: 6000.6.4f1
  PROJECT_PATH: Project/nameless

jobs:
  # 先把版本号算出来，后面所有地方都用它，避免手动触发时把分支名当版本。
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then
            echo "::error::手动触发必须填 version"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

  build:
    name: Build ${{ matrix.label }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            target: StandaloneWindows64
            image: windows-mono
          - label: macos-x64
            target: StandaloneOSX
            image: mac-mono
          - label: linux-x64
            target: StandaloneLinux64
            image: linux-il2cpp

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.target }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Project/nameless/Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.target }}-${{ env.UNITY_VERSION }}-
            Library-${{ matrix.target }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.target }}
          customImage: unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-${{ matrix.image }}-3
          buildMethod: LabPlayerBuild.RunFromCi
          # 让 builder 和 buildMethod 用同一个输出位置：
          #   builder 把 build/ 收走，脚本必须写到它指定的地方，
          #   否则 Package 步骤会对着空目录打包（之前就是这么失败的）。
          buildsPath: build
          buildName: Hui
          customParameters: -labBuildTarget ${{ matrix.target }} -labBuildOutput ${{ github.workspace }}/build/${{ matrix.target }}
          allowDirtyBuild: true

      # 统一命名：Hui-<版本>-<系统>-<架构>.zip
      - name: Package
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          SRC="build/${{ matrix.target }}"
          NAME="Hui-${VERSION}-${{ matrix.label }}.zip"
          echo "打包 $SRC -> $NAME"

          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC" 2>/dev/null)" ]; then
            echo "::error::构建目录 $SRC 不存在或为空"
            echo "--- build/ 下实际有什么 ---"
            find build -maxdepth 2 2>/dev/null | head -30
            exit 1
          fi

          ls -la "$SRC"
          (cd "$SRC" && zip -r -q "$GITHUB_WORKSPACE/$NAME" .)
          ls -la "$GITHUB_WORKSPACE/$NAME"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [setup, build]
    if: always() && needs.build.result == 'success' && (github.ref_type == 'tag' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          name: Hui ${{ needs.setup.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*.zip
