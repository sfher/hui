name: Release

# 打 tag（如 1.0.0）时自动构建三平台并发布；
# 也可以在 Actions 页手动触发，用 dry-run 只出包不发版。
on:
  push:
    tags:
      # 正式版 1.0.0 / 预发布 1.0.1-rc1。
      # 原来只写了 [0-9]+.[0-9]+.[0-9]+，带 -rc 这类后缀的 tag 匹配不上，
      # 推了 tag 却什么都不触发。
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手动触发必填，例如 1.0.0）"
        type: string
        default: ""
      dry_run:
        description: "只构建、不创建 Release"
        type: boolean
        default: true

env:
  UNITY_VERSION: 6000.6.4f1
  PROJECT_PATH: Project/nameless

jobs:
  # 先把版本号算出来，后面所有地方都用它，避免手动触发时把分支名当版本。
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then
            echo "::error::手动触发必须填 version"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

  build:
    name: Build ${{ matrix.label }} (${{ matrix.attempt }})
    needs: setup
    runs-on: ubuntu-latest
    # 每个平台跑 3 份冗余副本。
    #
    # macOS 在 GitHub 托管 runner 上约 1/4 概率被 OOM killer 杀掉（exit 137，
    # 停在加载 MacStandaloneSupport 之后约 0.6 秒）。这是环境层面的抖动，
    # 配置改不掉 —— 依据 game-ci/unity-builder#540：Docker 的 --memory 是硬限制，
    # 限制容器内存只会让 OOM 更早发生；Unity 自身也没有限制内存的设置。
    # mac-mono 也是唯一的 macOS 镜像，没有更轻的替代。
    #
    # 所以用冗余：3 份独立 runner 并行，同一平台只要有一份出包就算成功。
    # 单份失败率 1/4 时，3 份全败的概率约 1.6%。
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 仍然不在 CI 里（本地构建）。
          - label: macos-x64
            target: StandaloneOSX
            image: mac-mono
            attempt: a
          - label: macos-x64
            target: StandaloneOSX
            image: mac-mono
            attempt: b
          - label: macos-x64
            target: StandaloneOSX
            image: mac-mono
            attempt: c
          - label: linux-x64
            target: StandaloneLinux64
            image: base
            attempt: a
          - label: linux-x64
            target: StandaloneLinux64
            image: base
            attempt: b
          - label: linux-x64
            target: StandaloneLinux64
            image: base
            attempt: c

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.target }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Project/nameless/Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.target }}-${{ env.UNITY_VERSION }}-
            Library-${{ matrix.target }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.target }}
          customImage: unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-${{ matrix.image }}-3
          buildMethod: LabPlayerBuild.RunFromCi
          # 让 builder 和 buildMethod 用同一个输出位置：
          #   builder 把 build/ 收走，脚本必须写到它指定的地方，
          #   否则 Package 步骤会对着空目录打包（之前就是这么失败的）。
          buildsPath: build
          buildName: Hui
          customParameters: -labBuildTarget ${{ matrix.target }}
          allowDirtyBuild: true

      # 统一命名：Hui-<版本>-<系统>-<架构>.zip
      # 构建完立刻看宿主机上 build/ 到底有没有东西，
      # 用来分辨"容器里写了但卷没同步"和"根本没写进去"。
      - name: Inspect build output
        run: |
          echo "=== pwd: $(pwd) ==="
          echo "=== build/ 树 ==="
          find build -maxdepth 4 2>/dev/null | head -50
          echo "=== build/ 大小 ==="
          du -sh build 2>/dev/null || echo "build/ 不存在"

      - name: Package
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          NAME="Hui-${VERSION}-${{ matrix.label }}.zip"
          SRC="build/${{ matrix.target }}"

          echo "=== build/ 下的实际内容 ==="
          find build -maxdepth 3 | head -40

          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC" 2>/dev/null)" ]; then
            echo "::error::$SRC 不存在或为空"
            exit 1
          fi

          echo "打包 $SRC -> $NAME"
          ls -la "$SRC"
          (cd "$SRC" && zip -r -q "$GITHUB_WORKSPACE/$NAME" .)
          ls -la "$GITHUB_WORKSPACE/$NAME"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"

      # 构建日志无论成败都传上来。137/OOM 这类失败在 Unity 日志里
      # 只能看到"进程被打断"，但能确认停在哪一步（导入？着色器？打包？）。
      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-log-${{ matrix.label }}-${{ matrix.attempt }}
          path: ${{ env.PROJECT_PATH }}/Logs
          if-no-files-found: ignore
          retention-days: 7

      # 只在打包成功后才传，避免失败的 job 传个空壳上去，
      # 在 Release 阶段 merge-multiple 时把好的那份覆盖掉。
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ matrix.attempt }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [setup, build]
    # 两条独立的发版路径，互不依赖：
    #   1. 推 tag  → 无条件发版（tag 本身就是"要发版"的信号）
    #   2. 手动触发 → 只有 dry_run 明确为 false 才发
    # 分开写，避免 tag 触发时去读一个不存在的 inputs.dry_run。
    # 不看 needs.build.result：每个平台跑 3 份冗余，其中几分 OOM 失败是常态。
    # 真正该判断的是"每个平台有没有出到包"，交给下面的 Verify 步骤。
    if: >-
      always() && !cancelled() &&
      (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -la artifacts

      # 每个平台至少要有一份产出才发版 —— 3 份冗余里出到任意一份即可。
      # 缺平台说明该平台的 3 份全挂了，发出去会是残缺版本。
      - name: Verify each platform has at least one build
        run: |
          set -euo pipefail
          missing=0
          for p in macos-x64 linux-x64; do
            # 3 份产物同名（Hui-<版本>-<平台>.zip），合并后只会剩一份；
            # 但只要任意一份构建成功就有这个文件。
            if ls artifacts/Hui-*-"$p".zip >/dev/null 2>&1; then
              echo "OK   $p: $(ls artifacts/Hui-*-"$p".zip | head -1)"
            else
              echo "::error::缺少 $p 的构建产物（3 份冗余全部失败）"
              missing=1
            fi
          done
          exit $missing

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          name: Hui ${{ needs.setup.outputs.version }}
          draft: false
          # 带连字符的 tag（1.0.1-rc1）自动标成预发布，别让它顶到"最新正式版"上。
          prerelease: ${{ contains(needs.setup.outputs.version, '-') }}
          generate_release_notes: true
          files: artifacts/*.zip
