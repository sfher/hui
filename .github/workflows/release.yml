name: Release

# 打 tag（如 1.0.0）时自动构建三平台并发布；
# 也可以在 Actions 页手动触发，用 dry-run 只出包不发版。
on:
  push:
    tags:
      # 正式版 1.0.0 / 预发布 1.0.1-rc1。
      # 原来只写了 [0-9]+.[0-9]+.[0-9]+，带 -rc 这类后缀的 tag 匹配不上，
      # 推了 tag 却什么都不触发。
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手动触发必填，例如 1.0.0）"
        type: string
        default: ""
      dry_run:
        description: "只构建、不创建 Release"
        type: boolean
        default: true

env:
  UNITY_VERSION: 6000.6.4f1
  PROJECT_PATH: Project/nameless

jobs:
  # 先把版本号算出来，后面所有地方都用它，避免手动触发时把分支名当版本。
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then
            echo "::error::手动触发必须填 version"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

  build:
    name: Build ${{ matrix.label }} (${{ matrix.attempt }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 跑两份：这个平台在 GitHub 托管 runner 上的 OOM 成功率
          # 只有一半（最近 4 次 2 成功 2 失败），而且失败是 Unity 容器被
          # OOM killer 直接 SIGKILL，没法靠配置规避 —— 参见 game-ci/unity-builder#540，
          # 维护者明确说"限制容器内存只会让它更早崩"。
          # 两份独立 runner 并行跑，只要有一份成功就能出包。
          - label: windows-x64
            target: StandaloneWindows64
            image: windows-mono
            attempt: a
          - label: windows-x64
            target: StandaloneWindows64
            image: windows-mono
            attempt: b
          - label: macos-x64
            attempt: a
            target: StandaloneOSX
            # mac-mono 是唯一的 macOS 镜像，没有轻量替代。
            # 最近 4 次里 3 次成功 1 次 OOM（exit 137，停在
            # "Register platform support module: MacStandaloneSupport" 之后 0.6 秒），
            # 属于容器内存抖动，偶发。失败时用 gh run rerun --failed 重跑即可。
            image: mac-mono
          - label: linux-x64
            attempt: a
            target: StandaloneLinux64
            # 不用 linux-il2cpp 镜像：那个镜像体积大、加载 LinuxStandaloneSupport
            # 时稳定 OOM（进程在 Registered in 0.002s 之后 0.6 秒被 Killed，
            # 重跑两次都一样，不是抖动）。项目本身用的是 Mono 后端，
            # base 镜像内置 Linux 平台支持，够用且轻。
            image: base

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.target }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Project/nameless/Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.target }}-${{ env.UNITY_VERSION }}-
            Library-${{ matrix.target }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ matrix.target }}
          customImage: unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-${{ matrix.image }}-3
          buildMethod: LabPlayerBuild.RunFromCi
          # 无头构建不需要 GPU；开着会额外占显存和驱动内存，
          # 在只剩 1GB shm 的容器里更容易触发 OOM。
          enableGpu: false
          # 不设 dockerMemoryLimit / dockerCpuLimit。
          #
          # 试过写 14g + cpu 4，结果 Windows 从"能成功"变成稳定 137：
          # 默认值是宿主机内存的 95%（16GB → 15.2GB），写 14g 等于主动砍掉 1.2GB；
          # 再限 CPU 会让编译队列积压，内存峰值反而更高。
          # 保留默认（15.2GB）是和历史上成功那次一致的配置。
          # 让 builder 和 buildMethod 用同一个输出位置：
          #   builder 把 build/ 收走，脚本必须写到它指定的地方，
          #   否则 Package 步骤会对着空目录打包（之前就是这么失败的）。
          buildsPath: build
          buildName: Hui
          customParameters: -labBuildTarget ${{ matrix.target }}
          allowDirtyBuild: true

      # 统一命名：Hui-<版本>-<系统>-<架构>.zip
      # 构建完立刻看宿主机上 build/ 到底有没有东西，
      # 用来分辨"容器里写了但卷没同步"和"根本没写进去"。
      - name: Inspect build output
        run: |
          echo "=== pwd: $(pwd) ==="
          echo "=== build/ 树 ==="
          find build -maxdepth 4 2>/dev/null | head -50
          echo "=== build/ 大小 ==="
          du -sh build 2>/dev/null || echo "build/ 不存在"

      - name: Package
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          NAME="Hui-${VERSION}-${{ matrix.label }}.zip"
          SRC="build/${{ matrix.target }}"

          echo "=== build/ 下的实际内容 ==="
          find build -maxdepth 3 | head -40

          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC" 2>/dev/null)" ]; then
            echo "::error::$SRC 不存在或为空"
            exit 1
          fi

          echo "打包 $SRC -> $NAME"
          ls -la "$SRC"
          (cd "$SRC" && zip -r -q "$GITHUB_WORKSPACE/$NAME" .)
          ls -la "$GITHUB_WORKSPACE/$NAME"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"

      # 构建日志无论成败都传上来。137/OOM 这类失败在 Unity 日志里
      # 只能看到"进程被打断"，但能确认停在哪一步（导入？着色器？打包？）。
      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-log-${{ matrix.label }}
          path: ${{ env.PROJECT_PATH }}/Logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ matrix.attempt }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [setup, build]
    # 两条独立的发版路径，互不依赖：
    #   1. 推 tag  → 无条件发版（tag 本身就是"要发版"的信号）
    #   2. 手动触发 → 只有 dry_run 明确为 false 才发
    # 分开写，避免 tag 触发时去读一个不存在的 inputs.dry_run。
    # build 是矩阵 job：Windows 现在跑两份（一份成功一份 OOM 失败也算 build 整体 failure）。
    # 所以不能只看 needs.build.result，改成"确实有产物"才发版 —— 具体校验在下面的
    # Verify 步骤里做，缺任何一个平台的包就让 Release 失败，不发出残缺版本。
    if: >-
      always() && !cancelled() &&
      (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -la artifacts

      # 三个平台的包必须在齐才发版。Windows 跑了两份，只要有一份产出了就行；
      # 缺平台说明对应的 job 全挂了，发出去会是残缺版本。
      - name: Verify all platforms present
        run: |
          set -euo pipefail
          missing=0
          for p in windows-x64 macos-x64 linux-x64; do
            if ls artifacts/*-"$p".zip >/dev/null 2>&1; then
              echo "OK   $p: $(ls artifacts/*-"$p".zip | head -1)"
            else
              echo "::error::缺少 $p 的构建产物"
              missing=1
            fi
          done
          exit $missing

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          name: Hui ${{ needs.setup.outputs.version }}
          draft: false
          # 带连字符的 tag（1.0.1-rc1）自动标成预发布，别让它顶到"最新正式版"上。
          prerelease: ${{ contains(needs.setup.outputs.version, '-') }}
          generate_release_notes: true
          files: artifacts/*.zip
